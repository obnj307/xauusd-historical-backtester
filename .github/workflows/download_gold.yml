
name: Download XAUUSD M30

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Jahr der Gold-Daten"
        required: true
        default: "2024"
        type: choice
        options:
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gold-Daten herunterladen
        shell: bash
        run: |
          YEAR="${{ inputs.year }}"
          END_YEAR=$((YEAR + 1))

          npx --yes dukascopy-node \
            -i xauusd \
            -from "${YEAR}-01-01" \
            -to "${END_YEAR}-01-01" \
            -t m30 \
            -p bid \
            -f csv \
            -v \
            -dir data \
            -fn "XAUUSD_M30_${YEAR}" \
            --retries 3 \
            --batch-pause 2000

          test -s "data/XAUUSD_M30_${YEAR}.csv"

      - name: CSV als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-M30-${{ inputs.year }}
          path: data/XAUUSD_M30_${{ inputs.year }}.csv
          if-no-files-found: error
          retention-days: 30
